{% if site.data.honors.size > 0 %}
<section id="honors" class="academic-section" aria-labelledby="honors-title">
  <h2 id="honors-title" class="section-title"><span aria-hidden="true">🏅</span> Honors and Awards</h2>
  <ul>{% for honor in site.data.honors %}<li><code>{{ honor.award | escape }}</code>, {{ honor.name | escape }}.</li>{% endfor %}</ul>
</section>
{% endif %}
