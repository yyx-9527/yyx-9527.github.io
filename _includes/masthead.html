<header class="masthead">
  <div class="masthead__inner-wrap">
    <a class="site-brand" href="{{ '/' | relative_url }}" aria-label="返回首页">
      <span class="brand-mark" aria-hidden="true">{{ site.author.initials | escape }}</span>
      <span>{{ site.author.name_en | default: site.author.handle | escape }}<span class="brand-divider" aria-hidden="true"> / </span><span class="brand-label">学术主页</span></span>
    </a>
    <button class="nav-toggle" type="button" aria-controls="primary-nav" aria-expanded="false" hidden><span>菜单</span><i class="fas fa-bars" aria-hidden="true"></i></button>
    <nav id="primary-nav" aria-label="主导航">
      <ul class="site-links">
        {% for link in site.data.navigation.main %}
        <li><a href="{{ '/' | relative_url }}{{ link.url }}">{{ link.title }}</a></li>
        {% endfor %}
      </ul>
    </nav>
  </div>
</header>
