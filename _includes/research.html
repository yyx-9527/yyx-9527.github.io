{% if site.data.research.size > 0 %}
<section id="research" class="academic-section research-interests" aria-labelledby="research-title">
  <h2 id="research-title" class="visually-hidden">Research Interests</h2>
  <p>My research interests include:</p>
  <ul>
    {% for topic in site.data.research %}
    <li>{{ topic.title | escape }}{% if topic.description and topic.description != empty %}: {{ topic.description | escape }}{% endif %}</li>
    {% endfor %}
  </ul>
</section>
{% endif %}
