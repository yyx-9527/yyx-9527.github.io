- title: "严寒地区电力杆塔基础智能化评估及预警技术研究"
  period: "2024.12 — 至今"
  role: "核心成员"
  description: "面向吉林松原季节性冻土区，研究冻融循环及低洼积水结冰引起的桩基位移、塔脚变形与连接件损伤，为杆塔基础安全评估与预警提供依据。"
  contributions:
    - "参与实地调研与问题凝练，提出水–冰相变压力导致塔脚变形的研究思路。"
    - "基于 COMSOL 建立水–冰相变塔脚损伤模型，耦合传热、相变与固体力学，分析相变荷载下的应力与变形响应。"
    - "以第一作者发表相关论文，撰写《一种输电塔塔脚安全评估方法及系统》专利文稿。"
