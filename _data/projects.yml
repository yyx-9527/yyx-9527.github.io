- title: "Intelligent Assessment and Early Warning for Transmission Tower Foundations in Cold Regions"
  period: "2024.12 – Present"
  role: "Core team member"
  description: "Study of pile displacement, tower leg deformation, and connection damage caused by freeze–thaw cycles and the freezing of ponded water in seasonally frozen ground in Songyuan, Jilin, China."
  contributions:
    - "Contributed to field investigations and proposed water–ice phase-change pressure as a mechanism of tower leg deformation."
    - "Developed COMSOL models coupling heat transfer, phase change, and solid mechanics to analyze stress and deformation under ice loads."
    - "Published a related first-author paper and drafted a patent manuscript entitled 'A Method and System for Safety Assessment of Transmission Tower Legs.'"
