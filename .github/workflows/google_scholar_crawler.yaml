name: Update Google Scholar data (optional)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: google-scholar-stats
  cancel-in-progress: false

jobs:
  update:
    if: vars.ENABLE_GOOGLE_SCHOLAR == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: google_scholar_crawler/requirements.txt
      - name: Fetch citation data
        working-directory: google_scholar_crawler
        run: |
          test -n "$GOOGLE_SCHOLAR_ID" || { echo "Configure GOOGLE_SCHOLAR_ID first."; exit 1; }
          python -m pip install -r requirements.txt
          python main.py
      - name: Update statistics branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin google-scholar-stats >/dev/null; then
            git fetch origin google-scholar-stats
            git worktree add stats FETCH_HEAD
          else
            git worktree add --detach stats
            git -C stats switch --orphan google-scholar-stats
          fi
          cp google_scholar_crawler/results/*.json stats/
          git -C stats add gs_data.json gs_data_shieldsio.json
          if ! git -C stats diff --cached --quiet; then
            git -C stats commit -m "Update Google Scholar statistics"
            git -C stats push origin HEAD:google-scholar-stats
          fi
