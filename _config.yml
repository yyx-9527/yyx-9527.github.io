# 修改此文件后，需要重新启动本地 Jekyll 服务。
title: "Yixin Yang's Homepage"
description: "Yixin Yang studies mathematics at UESTC. His research interests include N-coalition games, distributed Nash equilibrium seeking, and transmission tower damage modeling."
url: "https://yyx-9527.github.io"
baseurl: ""
repository: "yyx-9527/yyx-9527.github.io"
lang: en
timezone: Asia/Shanghai

# 个人信息整理自本人提供的简历。空链接不会出现在页面上。
author:
  name: "Yixin Yang"
  name_en: "Yixin Yang"
  name_zh: "杨译鑫"
  initials: "YYX"
  handle: "yyx-9527"
  avatar: "" # 例如 /images/avatar.jpg；留空显示姓名缩写
  bio: "Mathematics · University of Electronic Science and Technology of China"
  location: ""
  email: "17628134116@163.com"
  github: "yyx-9527"
  googlescholar: ""
  orcid: ""
  researchgate: ""
  cv: "" # 例如 /files/cv.pdf

profile_incomplete: false
google_scholar_stats_enabled: false
google_scholar_stats_use_cdn: false
google_analytics_id: ""
google_site_verification: ""
bing_site_verification: ""
baidu_site_verification: ""

include:
  - _pages
exclude:
  - docs
  - scripts
  - google_scholar_crawler
  - vendor
  - node_modules
  - .bundle
  - .github
  - .tools
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - THIRD_PARTY_NOTICES.md
  - run_server.bat
  - run_server.sh
  - package.json
  - package-lock.json
  - "*.log"
  - assets/js/_main.js
  - assets/js/main.min.js
  - assets/js/plugins
  - assets/js/vendor
  - assets/js/collapse.js
  - assets/css/collapse.css
encoding: utf-8
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default
      author_profile: true
sass:
  sass_dir: _sass
  style: compressed
plugins:
  - jekyll-sitemap
  - jekyll-redirect-from
